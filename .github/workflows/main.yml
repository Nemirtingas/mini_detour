name: CI

on: [push, pull_request, workflow_dispatch]
jobs:
  job:
    name: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.build_type }}-cmake-build
    runs-on: ${{ matrix.os }}
    # ARM runs under qemu on Linux: its failures are shown, but don't fail the workflow.
    continue-on-error: ${{ matrix.platform == 'arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # arm is cross compiled and runs under qemu, on Linux only.
        platform: [x32, x64, arm]
        # Release catches what only shows once optimized: small functions, inlined calls, tail calls...
        build_type: [Debug, Release]
        exclude:
        - os: windows-latest
          platform: arm
        include:
        # arm64 runs on native runners.
        - os: ubuntu-24.04-arm
          platform: arm64
          build_type: Debug
        - os: ubuntu-24.04-arm
          platform: arm64
          build_type: Release
        - os: windows-11-arm
          platform: arm64
          build_type: Debug
        - os: windows-11-arm
          platform: arm64
          build_type: Release
        # macos-latest runs on Apple Silicon. macOS x64 is tested on a local machine.
        - os: macos-latest
          platform: arm64
          build_type: Debug
        - os: macos-latest
          platform: arm64
          build_type: Release
            
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Linux tests gcc (x32)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.platform == 'x32' }}
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt install -y gcc-multilib g++-multilib # needed for 32-bit builds
          
          cmake ${{ github.workspace }}/CMakeLists.txt -DCMAKE_TOOLCHAIN_FILE="tests/toolchains/linux_i386.toolchain" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build
          cmake --build build
          #find build
          cd ${{ github.workspace }}/build
          ./tests

      - name: Linux tests gcc (x64)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.platform == 'x64' }}
        shell: bash
        run: |
          cmake ${{ github.workspace }}/CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build
          cmake --build build
          cd ${{ github.workspace }}/build
          ./tests

      - name: Linux tests gcc (arm, qemu)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.platform == 'arm' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi qemu-user

          cmake ${{ github.workspace }}/CMakeLists.txt -DCMAKE_TOOLCHAIN_FILE="tests/toolchains/linux_arm.toolchain" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build
          cmake --build build
          cd ${{ github.workspace }}/build
          qemu-arm -L /usr/arm-linux-gnueabi ./tests

      - name: Linux tests gcc (arm64)
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        shell: bash
        run: |
          cmake ${{ github.workspace }}/CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build
          cmake --build build
          cd ${{ github.workspace }}/build
          ./tests

      - name: MacOS tests (arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cmake ${{ github.workspace }}/CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build
          cmake --build build
          #find build
          cd ${{ github.workspace }}/build
          ./macos_permission_fix tests
          ./tests

      - name: Windows tests (x32)
        if: ${{ matrix.os == 'windows-latest' && matrix.platform == 'x32' }}
        shell: powershell
        run: |
          cmake ${{ github.workspace }}\CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build -A Win32
          cmake --build build --config ${{ matrix.build_type }}
          #Get-ChildItem -Recurse build
          cd ${{ github.workspace }}\build\${{ matrix.build_type }}
          .\tests.exe

      - name: Windows tests (x64)
        if: ${{ matrix.os == 'windows-latest' && matrix.platform == 'x64' }}
        shell: powershell
        run: |
          cmake ${{ github.workspace }}\CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build -A x64
          cmake --build build --config ${{ matrix.build_type }}
          #Get-ChildItem -Recurse build
          cd ${{ github.workspace }}\build\${{ matrix.build_type }}
          .\tests.exe

      - name: Windows tests (arm64)
        if: ${{ matrix.os == 'windows-11-arm' }}
        shell: powershell
        run: |
          cmake ${{ github.workspace }}\CMakeLists.txt -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMINIDETOUR_BUILD_TESTS=ON -S . -B build -A ARM64
          cmake --build build --config ${{ matrix.build_type }}
          cd ${{ github.workspace }}\build\${{ matrix.build_type }}
          .\tests.exe
