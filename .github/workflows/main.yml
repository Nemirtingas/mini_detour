name: CI

on: [push, pull_request, workflow_dispatch]
jobs:
  job:
    name: ${{ matrix.target.name }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release catches what only shows once optimized: small functions, inlined calls, tail calls...
        build_type: [Debug, Release]
        # Each target gives what differs: its runner, the packages to install, the CMake arguments and how to run the tests.
        # Every target runs natively: arm is cross compiled and runs on the arm64 runner, which executes 32 bits ARM code,
        # through the loader of the cross toolchain. macOS x64 is tested on a local machine.
        target:
        - name: linux-x32
          os: ubuntu-latest
          packages: gcc-multilib g++-multilib
          cmake_args: -DCMAKE_TOOLCHAIN_FILE=tests/toolchains/linux_i386.toolchain
          run: ./tests
        - name: linux-x64
          os: ubuntu-latest
          run: ./tests
        - name: linux-arm
          os: ubuntu-24.04-arm
          packages: gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          cmake_args: -DCMAKE_TOOLCHAIN_FILE=tests/toolchains/linux_arm.toolchain
          run: /usr/arm-linux-gnueabi/lib/ld-linux.so.3 --library-path /usr/arm-linux-gnueabi/lib ./tests
        - name: linux-arm64
          os: ubuntu-24.04-arm
          run: ./tests
        - name: macos-arm64
          os: macos-latest
          run: ./macos_permission_fix tests && ./tests
        - name: windows-x32
          os: windows-latest
          cmake_args: -A Win32
          run: ./tests.exe
        - name: windows-x64
          os: windows-latest
          cmake_args: -A x64
          run: ./tests.exe
        - name: windows-arm64
          os: windows-11-arm
          cmake_args: -A ARM64
          run: ./tests.exe

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Install packages
        if: ${{ matrix.target.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.packages }}

      # The Visual Studio generator builds several configurations: the configuration is chosen with --config.
      - name: Configure
        run: cmake -S . -B build -DMINIDETOUR_BUILD_TESTS=ON ${{ runner.os != 'Windows' && format('-DCMAKE_BUILD_TYPE={0}', matrix.build_type) || '' }} ${{ matrix.target.cmake_args }}

      # The runners have 3 or 4 cores. Without a count, make would run any number of jobs.
      - name: Build
        id: build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        working-directory: ${{ runner.os == 'Windows' && format('build/{0}', matrix.build_type) || 'build' }}
        run: ${{ matrix.target.run }}

      # The memory regions as the library lists them, to check them on each target: only the [vmmap] tests log at the
      # info level, the whole suite would give tens of thousands of lines.
      - name: Memory regions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.os == 'Windows' && format('build/{0}', matrix.build_type) || 'build' }}
        env:
          MINIDETOUR_TEST_LOG_LEVEL: info
        run: ${{ matrix.target.run }} "[vmmap]"
